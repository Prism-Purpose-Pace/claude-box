# Moves the box to the next NixOS release (YY.05 -> YY.11 -> YY+1.05) as soon
# as its channel exists, but only if the system builds and the VM test passes.
# Each NixOS release gets security updates for about seven months, so without
# this the box would silently fall out of support twice a year.
# system.stateVersion is intentionally left alone.
name: nixos-release

on:
  schedule:
    - cron: '7 3 * * 2' # Tuesdays, after Monday's flake update
  workflow_dispatch:

permissions: {}

concurrency:
  group: box-refs/heads/main
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write # commits box/flake.nix + box/flake.lock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find next release
        id: next
        run: |
          current=$(grep -oE 'nixos-[0-9]{2}\.(05|11)' box/flake.nix | head -1 | cut -d- -f2)
          yy=${current%.*}; mm=${current#*.}
          if [ "$mm" = "05" ]; then next="$yy.11"; else next="$((10#$yy + 1)).05"; fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          if curl -fsSIL -o /dev/null "https://channels.nixos.org/nixos-$next/nixexprs.tar.xz"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "NixOS $next is available (box is on $current)"
          else
            echo "NixOS $next not released yet, box stays on $current"
          fi

      - uses: ./.github/actions/setup-nix
        if: steps.next.outputs.available == 'true'

      - name: Enable KVM for the VM test
        if: steps.next.outputs.available == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Switch, build, test
        if: steps.next.outputs.available == 'true'
        env:
          CURRENT: ${{ steps.next.outputs.current }}
          NEXT: ${{ steps.next.outputs.next }}
        run: |
          sed -i "s/nixos-$CURRENT/nixos-$NEXT/g" box/flake.nix
          nix flake update --flake ./box
          nix build -L ./box#toplevel
          nix build -L ./box#checks.x86_64-linux.vm

      - name: Commit
        if: steps.next.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.next.outputs.next }}
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add box/flake.nix box/flake.lock
          git commit -m "box: move to NixOS $NEXT"
          for _ in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
